name: Publish review

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write

concurrency:
  group: review-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the gh-pages branch
        run: |
          set -euo pipefail
          test -f review/index.html
          test -f review/look-inside/paperback-01.png
          test -f review/a-plus/header-970x300.jpg
          git push origin HEAD:gh-pages

      - name: Turn on GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" -f source[branch]=gh-pages -f source[path]=/
          echo "branch source exit: $?"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          echo "workflow source exit: $?"
          gh api "/repos/${GITHUB_REPOSITORY}/pages" || true
