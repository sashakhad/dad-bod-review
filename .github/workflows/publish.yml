name: Publish review

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update gh-pages
        run: |
          set -euo pipefail
          test -f review/look-inside/paperback-01.png
          test -f review/a-plus/header-970x300.jpg
          grep -q 'raw.githubusercontent.com' review/index.html
          git push --force origin HEAD:gh-pages
